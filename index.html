<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rio Beach Rugby 2027</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: "#0B1354", // Logo Dark Blue
              orange: "#F27405", // Accent Orange
              sun: "#FFB800", // Bright, vibrant yellow (no pastels)
              offwhite: "#F9FAFB", // Clean off-white for depth
            },
            fontFamily: {
              sans: ["Open Sans", "sans-serif"],
              display: ["Montserrat", "sans-serif"],
            },
            backgroundImage: {
              "hero-img": "url('imagem-02.avif')",
            },
          },
        },
      };
    </script>

    <style>
      /* Smooth Scroll Reveal Animations */
      .reveal {
        opacity: 0;
        transform: translateY(40px);
        transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      .reveal-delay-1 {
        transition-delay: 0.15s;
      }
      .reveal-delay-2 {
        transition-delay: 0.3s;
      }

      /* Dynamic Logo Sizing on Scroll & Responsiveness (Adjusted for overhang) */
      .logo-img {
        height: 4rem; /* 64px - Mobile Initial */
        transition: height 0.3s ease-in-out;
      }
      @media (min-width: 640px) {
        .logo-img {
          height: 5.5rem; /* 88px - Small screens */
        }
      }
      @media (min-width: 768px) {
        .logo-img {
          height: 6.5rem; /* 104px - Desktop Initial */
        }
      }

      /* Logo Sizing when Scrolled */
      nav.scrolled .logo-img {
        height: 3rem; /* 48px - Mobile Scrolled */
      }
      @media (min-width: 640px) {
        nav.scrolled .logo-img {
          height: 3.5rem; /* 56px - Small screens Scrolled */
        }
      }
      @media (min-width: 768px) {
        nav.scrolled .logo-img {
          height: 4.5rem; /* 72px - Desktop Scrolled */
        }
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #0b1354;
      }
      ::-webkit-scrollbar-thumb {
        background: #f27405;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ffb800;
      }

      /* Ensure images inside overlapping sections don't overflow */
      .overlap-section {
        overflow: hidden;
      }

      /* Mobile menu: 90% da tela, desliza de cima para baixo */
      #mobile-menu {
        transform: translateY(-100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #mobile-menu.open {
        transform: translateY(0);
      }
      #mobile-overlay {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #mobile-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }
      body.menu-open {
        overflow: hidden;
      }

      /* Sandy Summer featured section */
      .arcade-glow {
        box-shadow:
          0 0 0 1px rgba(255, 184, 0, 0.25),
          0 20px 60px rgba(242, 116, 5, 0.35),
          0 0 80px rgba(255, 184, 0, 0.15);
      }
      @keyframes arcade-pulse {
        0%,
        100% {
          box-shadow:
            0 0 0 1px rgba(255, 184, 0, 0.25),
            0 20px 60px rgba(242, 116, 5, 0.35),
            0 0 80px rgba(255, 184, 0, 0.15);
        }
        50% {
          box-shadow:
            0 0 0 2px rgba(255, 184, 0, 0.45),
            0 24px 70px rgba(242, 116, 5, 0.5),
            0 0 100px rgba(255, 184, 0, 0.25);
        }
      }
      .arcade-glow {
        animation: arcade-pulse 3s ease-in-out infinite;
      }

      /* Mostra só parte dos parágrafos vindos das traduções; o texto completo segue nos dicionários */
      .copy-lead > p:not(:first-child),
      .copy-ends > p:not(:first-child):not(:last-child) {
        display: none;
      }
    </style>
  </head>
  <body
    class="font-sans text-gray-800 antialiased bg-navy selection:bg-orange selection:text-white"
  >
    <nav
      id="navbar"
      class="fixed w-full z-[100] transition-colors duration-300 bg-transparent"
    >
      <div id="nav-container" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 xl:pl-48 relative h-20 md:h-28 flex justify-end items-center gap-3 md:gap-6 transition-all duration-300">

        <!-- Logo (Absoluta para criar o efeito de caimento) -->
        <a href="#" class="absolute top-0 left-4 sm:left-6 lg:left-8 transition-transform duration-300 hover:scale-105 origin-top z-50">
          <div
            class="bg-white px-3 pt-3 pb-4 md:px-5 md:pt-4 md:pb-6 rounded-b-[1.5rem] md:rounded-b-[2rem] shadow-2xl border-b-[6px] md:border-b-8 border-orange flex items-center justify-center"
          >
            <img
              class="logo-img w-auto object-contain"
              src="logo.png"
              alt="RBR 27 Logo"
              onerror="
                this.src =
                  'https://placehold.co/200x200/FFFFFF/0B1354?text=RBR+2027'
              "
            />
          </div>
        </a>

        <!-- Desktop section menu -->
        <ul
          class="hidden xl:flex items-center gap-1 font-display font-bold uppercase tracking-wide text-xs 2xl:text-sm text-white whitespace-nowrap"
        >
          <li>
            <a href="#tournament" class="px-3 py-2 rounded-full hover:bg-white/10 hover:text-sun transition-colors" data-i18n="nav_tournament"></a>
          </li>
          <li>
            <a href="#reasons" class="px-3 py-2 rounded-full hover:bg-white/10 hover:text-sun transition-colors" data-i18n="nav_reasons"></a>
          </li>
          <li>
            <a href="#arcade" class="px-3 py-2 rounded-full text-sun hover:bg-white/10 transition-colors" data-i18n="nav_arcade"></a>
          </li>
          <li>
            <a href="#partners" class="px-3 py-2 rounded-full hover:bg-white/10 hover:text-sun transition-colors" data-i18n="nav_partners"></a>
          </li>
          <li class="ml-2">
            <a href="#cta" class="px-4 py-2.5 rounded-full bg-orange text-white hover:bg-sun hover:text-navy transition-colors" data-i18n="nav_cta"></a>
          </li>
        </ul>

        <!-- Language Selector -->
        <div class="relative group z-10">
          <select
            id="lang-switcher"
            class="appearance-none bg-navy text-white font-display font-bold uppercase tracking-wide py-2 md:py-3 pl-4 pr-10 rounded-full border-2 border-white/20 hover:border-orange focus:outline-none focus:ring-2 focus:ring-orange cursor-pointer shadow-md text-xs md:text-sm transition-all"
          >
            <option value="pt">BR / PT</option>
            <option value="en">US / EN</option>
            <option value="es">ES / ES</option>
          </select>
          <div
            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-orange"
          >
            <i class="fas fa-globe"></i>
          </div>
        </div>

        <!-- Mobile hamburger -->
        <button
          id="menu-toggle"
          type="button"
          class="xl:hidden relative z-10 w-11 h-11 flex flex-col items-center justify-center gap-[5px] rounded-full border-2 border-white/20 bg-navy text-white hover:border-orange transition-colors"
          aria-label="Abrir menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          <span class="menu-bar block w-5 h-0.5 bg-white rounded-full transition-all duration-300 origin-center"></span>
          <span class="menu-bar block w-5 h-0.5 bg-white rounded-full transition-all duration-300"></span>
          <span class="menu-bar block w-5 h-0.5 bg-white rounded-full transition-all duration-300 origin-center"></span>
        </button>
      </div>
    </nav>

    <!-- Mobile menu overlay + drawer -->
    <div
      id="mobile-overlay"
      class="fixed inset-0 z-[110] bg-navy/70 backdrop-blur-sm xl:hidden"
      aria-hidden="true"
    ></div>
    <aside
      id="mobile-menu"
      class="fixed top-0 left-0 right-0 z-[120] max-h-[90vh] w-full bg-navy border-b-4 border-orange shadow-2xl xl:hidden flex flex-col rounded-b-[2rem]"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-label="Menu de navegação"
    >
      <div class="flex items-center justify-between px-6 pt-6 pb-4 border-b border-white/10">
        <span class="font-display font-black uppercase tracking-widest text-sun text-sm" data-i18n="nav_menu"></span>
        <button
          id="menu-close"
          type="button"
          class="w-11 h-11 flex items-center justify-center rounded-full border-2 border-white/20 text-white hover:border-orange hover:text-orange transition-colors"
          aria-label="Fechar menu"
        >
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      <nav class="flex-1 overflow-y-auto px-6 py-6">
        <ul class="flex flex-col gap-2 font-display font-black uppercase tracking-wide text-xl sm:text-2xl text-white">
          <li>
            <a href="#tournament" class="mobile-nav-link block py-4 border-b border-white/10 hover:text-sun transition-colors" data-i18n="nav_tournament"></a>
          </li>
          <li>
            <a href="#reasons" class="mobile-nav-link block py-4 border-b border-white/10 hover:text-sun transition-colors" data-i18n="nav_reasons"></a>
          </li>
          <li>
            <a href="#arcade" class="mobile-nav-link block py-4 border-b border-white/10 text-sun hover:text-orange transition-colors" data-i18n="nav_arcade"></a>
          </li>
          <li>
            <a href="#partners" class="mobile-nav-link block py-4 border-b border-white/10 hover:text-sun transition-colors" data-i18n="nav_partners"></a>
          </li>
          <li>
            <a href="#cta" class="mobile-nav-link mt-6 inline-flex items-center justify-center gap-2 w-full bg-orange text-white py-4 rounded-full hover:bg-sun hover:text-navy transition-colors text-lg" data-i18n="nav_cta"></a>
          </li>
        </ul>
      </nav>
      <div class="px-6 pb-8 pt-4 border-t border-white/10">
        <p class="font-display font-bold uppercase tracking-widest text-orange text-sm" data-i18n="ftr_motto"></p>
      </div>
    </aside>

    <!-- 01 — HERO -->
    <header
      class="relative min-h-screen flex items-center justify-center overflow-hidden bg-navy pb-32"
    >
      <div class="absolute inset-0 z-0">
        <div
          class="absolute inset-0 bg-hero-img bg-cover bg-center bg-no-repeat transform scale-105"
        ></div>
        <div
          class="absolute inset-0 bg-gradient-to-b from-navy/90 via-navy/60 to-navy/95"
        ></div>
      </div>

      <div
        class="relative z-10 w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center pt-28 md:pt-36"
      >
        <div
          class="inline-block bg-orange text-white font-display font-bold uppercase tracking-[0.2em] px-4 py-1 rounded-full mb-6 text-xs md:text-sm shadow-lg reveal"
          data-i18n="hero_sup"
        ></div>

        <h1
          class="font-display font-black text-5xl md:text-7xl lg:text-8xl text-white leading-[1] uppercase drop-shadow-2xl mb-8 reveal reveal-delay-1"
        >
          <span data-i18n="hero_t1"></span><br />
          <span class="text-sun" data-i18n="hero_t2"></span><br />
          <span data-i18n="hero_t3"></span>
        </h1>

        <div
          class="flex flex-wrap items-center justify-center gap-3 text-white font-display font-bold tracking-wider uppercase text-sm md:text-lg mb-8 reveal reveal-delay-2"
        >
          <span class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-5 py-2.5 rounded-full border border-white/20">
            <i class="far fa-calendar text-sun"></i>
            <span data-i18n="hero_date"></span>
          </span>
          <span class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-5 py-2.5 rounded-full border border-white/20">
            <i class="fas fa-location-dot text-orange"></i>
            <span data-i18n="hero_loc"></span>
          </span>
        </div>

        <p
          class="max-w-2xl mx-auto text-lg md:text-xl text-white/85 font-medium mb-10 reveal reveal-delay-2"
          data-i18n="hero_p1"
        ></p>

        <div
          class="flex flex-col sm:flex-row items-center justify-center gap-4 reveal reveal-delay-2"
        >
          <a
            href="https://wa.me/5521964576591"
            data-wa="wa_m1"
            target="_blank"
            class="w-full sm:w-auto bg-orange text-white font-display font-black text-lg md:text-xl uppercase px-10 py-5 rounded-full shadow-[0_0_30px_rgba(242,116,5,0.4)] hover:bg-sun hover:text-navy hover:shadow-[0_0_30px_rgba(255,184,0,0.6)] transition-all flex items-center justify-center gap-3"
          >
            <span data-i18n="cta_team"></span>
            <i class="fas fa-arrow-right"></i>
          </a>
          <a
            href="#weekend"
            class="w-full sm:w-auto bg-transparent text-white font-display font-bold text-lg md:text-xl uppercase px-10 py-5 rounded-full border-2 border-white/50 hover:bg-white hover:text-navy transition-all flex items-center justify-center gap-2"
          >
            <span data-i18n="hero_cta2"></span>
            <i class="fas fa-chevron-down"></i>
          </a>
        </div>
      </div>
    </header>

    <!-- 02 — O FIM DE SEMANA -->
    <section
      id="weekend"
      class="bg-white rounded-t-[3rem] md:rounded-t-[6rem] -mt-20 md:-mt-32 relative z-10 pt-20 md:pt-28 overlap-section shadow-[0_-10px_40px_rgba(0,0,0,0.2)] pb-[10rem] scroll-mt-20"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center">
          <div class="reveal">
            <h2
              class="font-display font-black text-4xl md:text-5xl text-navy uppercase leading-tight mb-4"
              data-i18n="wknd_h"
            ></h2>
            <p
              class="font-display font-bold text-2xl text-sun mb-6"
              data-i18n="wknd_sub"
            ></p>
            <p class="text-lg text-gray-700 font-medium mb-8" data-i18n="wknd_p1"></p>
            <div
              class="bg-offwhite p-6 rounded-2xl border-l-8 border-orange shadow-sm"
            >
              <p
                class="font-display uppercase text-xl text-navy font-black"
                data-i18n="wknd_highlight"
              ></p>
            </div>
          </div>

          <div class="reveal reveal-delay-1">
            <div class="relative">
              <div
                class="absolute inset-0 bg-orange rounded-3xl transform translate-x-4 translate-y-4 md:translate-x-6 md:translate-y-6"
              ></div>
              <img
                src="imagem-04.avif"
                alt="Jogadoras sorrindo"
                class="relative z-10 w-full h-auto object-cover rounded-3xl shadow-xl border-4 border-white"
                onerror="
                  this.src =
                    'https://placehold.co/600x400/F27405/FFFFFF?text=Jogadoras+Rio'
                "
              />
            </div>
            <div
              class="relative z-20 -mt-12 mx-4 sm:mx-10 flex items-start gap-3 bg-sun text-navy px-5 py-4 rounded-2xl shadow-xl"
            >
              <i class="fas fa-fire text-orange text-xl mt-0.5"></i>
              <p class="font-medium" data-i18n="wknd_carnival"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 03 — O TORNEIO -->
    <section
      id="tournament"
      class="bg-navy text-white rounded-t-[3rem] md:rounded-t-[6rem] -mt-20 md:-mt-32 relative z-20 pt-20 md:pt-28 overlap-section shadow-[0_-10px_40px_rgba(0,0,0,0.3)] pb-[10rem] scroll-mt-20"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl mx-auto text-center mb-14 reveal">
          <h2
            class="font-display font-black text-4xl md:text-5xl uppercase text-white leading-tight mb-6"
            data-i18n="trn_h"
          ></h2>
          <p class="text-lg md:text-xl text-gray-300 font-medium" data-i18n="trn_p4"></p>
        </div>

        <h3
          class="text-center font-display font-black text-orange tracking-[0.15em] uppercase text-2xl md:text-3xl mb-8 reveal"
          data-i18n="rules_title"
        ></h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
          <div class="bg-white rounded-2xl p-5 md:p-6 flex items-start gap-4 border-b-4 border-orange reveal">
            <div class="shrink-0 bg-navy text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl">
              <i class="fas fa-hand-paper"></i>
            </div>
            <div>
              <h4 class="font-display font-black text-lg uppercase text-navy leading-tight mb-1" data-i18n="r1_t"></h4>
              <p class="text-gray-600 font-medium" data-i18n="r1_d"></p>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-5 md:p-6 flex items-start gap-4 border-b-4 border-sun reveal reveal-delay-1">
            <div class="shrink-0 bg-navy text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl">
              <i class="fas fa-bolt"></i>
            </div>
            <div>
              <h4 class="font-display font-black text-lg uppercase text-navy leading-tight mb-1" data-i18n="r2_t"></h4>
              <p class="text-gray-600 font-medium" data-i18n="r2_d"></p>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-5 md:p-6 flex items-start gap-4 border-b-4 border-orange reveal reveal-delay-2">
            <div class="shrink-0 bg-navy text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl">
              <i class="fas fa-ban"></i>
            </div>
            <div>
              <h4 class="font-display font-black text-lg uppercase text-navy leading-tight mb-1" data-i18n="r3_t"></h4>
              <p class="text-gray-600 font-medium" data-i18n="r3_d"></p>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-5 md:p-6 flex items-start gap-4 border-b-4 border-sun reveal">
            <div class="shrink-0 bg-navy text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl">
              <i class="fas fa-users-slash"></i>
            </div>
            <div>
              <h4 class="font-display font-black text-lg uppercase text-navy leading-tight mb-1" data-i18n="r4_t"></h4>
              <p class="text-gray-600 font-medium" data-i18n="r4_d"></p>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-5 md:p-6 flex items-start gap-4 border-b-4 border-orange reveal reveal-delay-1">
            <div class="shrink-0 bg-navy text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl">
              <i class="fas fa-sync-alt"></i>
            </div>
            <div>
              <h4 class="font-display font-black text-lg uppercase text-navy leading-tight mb-1" data-i18n="r5_t"></h4>
              <p class="text-gray-600 font-medium" data-i18n="r5_d"></p>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-5 md:p-6 flex items-start gap-4 border-b-4 border-sun reveal reveal-delay-2">
            <div class="shrink-0 bg-navy text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl">
              <i class="fas fa-venus-mars"></i>
            </div>
            <div>
              <h4 class="font-display font-black text-lg uppercase text-navy leading-tight mb-1" data-i18n="r6_t"></h4>

    <!-- 04 — POR QUE TRAZER SEU TIME? -->
    <section
      id="reasons"
      class="bg-offwhite rounded-t-[3rem] md:rounded-t-[6rem] -mt-20 md:-mt-32 relative z-30 pt-20 md:pt-28 overlap-section shadow-[0_-10px_40px_rgba(0,0,0,0.1)] pb-[10rem] scroll-mt-20"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-14 reveal">
          <h2
            class="font-display font-black text-4xl md:text-5xl text-navy uppercase mb-4"
            data-i18n="reas_h1"
          ></h2>
          <p
            class="font-display font-bold text-xl md:text-2xl text-orange uppercase tracking-wide"
            data-i18n="reas_h2"
          ></p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
          <div class="bg-white rounded-[2rem] p-8 shadow-lg border border-gray-100 reveal">
            <div class="w-14 h-14 bg-navy text-white rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-md">
              <i class="fas fa-sun"></i>
            </div>
            <p class="font-display font-bold text-orange uppercase tracking-widest text-sm mb-2">
              01 — <span data-i18n="rsn1_t"></span>
            </p>
            <h3 class="font-display font-black text-2xl uppercase text-navy leading-tight mb-4" data-i18n="rsn1_h"></h3>
            <div class="copy-ends space-y-3 text-gray-600 font-medium text-lg leading-relaxed" data-i18n="rsn1_d"></div>
          </div>

          <div class="bg-white rounded-[2rem] p-8 shadow-lg border border-gray-100 reveal reveal-delay-1">
            <div class="w-14 h-14 bg-orange text-white rounded-2xl flex items-center justify-center text-2xl mb-6 shadow-md">
              <i class="fas fa-mountain"></i>
            </div>
            <p class="font-display font-bold text-orange uppercase tracking-widest text-sm mb-2">
              02 — <span data-i18n="rsn2_t"></span>
            </p>
            <h3 class="font-display font-black text-2xl uppercase text-navy leading-tight mb-4" data-i18n="rsn2_h"></h3>

      // 2. Language Switcher Logic
      const applyLanguage = (lang) => {
        const dict = translations[lang];
        document.documentElement.lang = HTML_LANG[lang];
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const value = dict[el.dataset.i18n] ?? "";
          el.innerHTML = value;
          el.style.display = value ? "" : "none";
        });
        document.querySelectorAll("[data-i18n-block]").forEach((el) => {
          el.style.display = dict[el.dataset.i18nBlock] ? "" : "none";
        });
        document.querySelectorAll("[data-wa]").forEach((el) => {
          el.href = `${WA_URL}?text=${encodeURIComponent(dict[el.dataset.wa])}`;
        });
      };

      const switcher = document.getElementById("lang-switcher");
      switcher.addEventListener("change", (e) => applyLanguage(e.target.value));
      applyLanguage(switcher.value);

      // 3. Sticky Navbar Background Change on Scroll
      const nav = document.getElementById("navbar");

      window.addEventListener("scroll", () => {
        if (window.scrollY > 50) {
          // Scrolled State
          nav.classList.add("bg-navy", "shadow-lg", "scrolled");
          nav.classList.remove("bg-transparent");
          
          // Reduz a altura do nav para esconder parte da logo
          navContainer.classList.remove("h-20", "md:h-28");
          navContainer.classList.add("h-16", "md:h-20");
        } else {
          // Initial State
          nav.classList.remove("bg-navy", "shadow-lg", "scrolled");
          nav.classList.add("bg-transparent");
          
          // Volta a altura do nav para abrigar a logo maior no topo
          navContainer.classList.add("h-20", "md:h-28");
          navContainer.classList.remove("h-16", "md:h-20");
        }
      });

      // 3b. Mobile hamburger menu (90% da tela, de cima para baixo)
      const menuToggle = document.getElementById("menu-toggle");
      const menuClose = document.getElementById("menu-close");
      const mobileMenu = document.getElementById("mobile-menu");
      const mobileOverlay = document.getElementById("mobile-overlay");
      const menuBars = menuToggle.querySelectorAll(".menu-bar");

      const openMobileMenu = () => {
        mobileMenu.classList.add("open");
        mobileOverlay.classList.add("open");
        document.body.classList.add("menu-open");
        menuToggle.setAttribute("aria-expanded", "true");
        mobileMenu.setAttribute("aria-hidden", "false");
        mobileOverlay.setAttribute("aria-hidden", "false");
        menuBars[0].classList.add("translate-y-[7px]", "rotate-45");
        menuBars[1].classList.add("opacity-0");
        menuBars[2].classList.add("-translate-y-[7px]", "-rotate-45");
      };

      const closeMobileMenu = () => {
        mobileMenu.classList.remove("open");
        mobileOverlay.classList.remove("open");
        document.body.classList.remove("menu-open");
        menuToggle.setAttribute("aria-expanded", "false");
        mobileMenu.setAttribute("aria-hidden", "true");
        mobileOverlay.setAttribute("aria-hidden", "true");
        menuBars[0].classList.remove("translate-y-[7px]", "rotate-45");
        menuBars[1].classList.remove("opacity-0");
        menuBars[2].classList.remove("-translate-y-[7px]", "-rotate-45");
      };

      menuToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (mobileMenu.classList.contains("open")) {
          closeMobileMenu();
        } else {
          openMobileMenu();
        }
      });
      menuClose.addEventListener("click", closeMobileMenu);
      mobileOverlay.addEventListener("click", closeMobileMenu);
      document.querySelectorAll(".mobile-nav-link").forEach((link) => {
        link.addEventListener("click", closeMobileMenu);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && mobileMenu.classList.contains("open")) {
          closeMobileMenu();

      const waMenu = document.getElementById("wa-menu");
      const waClose = document.getElementById("wa-close");

      const toggleMenu = (e) => {
        if (e) e.stopPropagation();
        if (waMenu.classList.contains("hidden")) {
          waMenu.classList.remove("hidden");
          // Small timeout to allow display:block to apply before animating opacity
          setTimeout(() => {
            waMenu.classList.remove("opacity-0", "scale-95");
            waMenu.classList.add("opacity-100", "scale-100");
          }, 10);
        } else {
          waMenu.classList.remove("opacity-100", "scale-100");
          waMenu.classList.add("opacity-0", "scale-95");
          setTimeout(() => {
            waMenu.classList.add("hidden");
          }, 300); // match duration-300
        }
      };

      waBtn.addEventListener("click", toggleMenu);
      waClose.addEventListener("click", toggleMenu);

      // Close modal when clicking outside
      document.addEventListener("click", (e) => {
        if (
          !waMenu.contains(e.target) &&
          !waBtn.contains(e.target) &&
          !waMenu.classList.contains("hidden")
        ) {
          toggleMenu();
        }
      });

      // 5. Scroll Reveal Animations (Intersection Observer)
      const revealElements = document.querySelectorAll(".reveal");
      const revealObserver = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("active");
              observer.unobserve(entry.target);
            }
          });
        },
        {
          root: null,
          threshold: 0.1,
          rootMargin: "0px 0px -50px 0px",
        },
      );

      revealElements.forEach((el) => revealObserver.observe(el));
    </script>
  </body>
</html>
