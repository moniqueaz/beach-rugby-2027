<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="Sandy Summer">
  <title>Sandy Summer</title>
  <defs>
    <linearGradient id="sandyFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="45%" stop-color="#F27405"/>
      <stop offset="100%" stop-color="#D45500"/>
    </linearGradient>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;display=swap');
      .logo-text {
        font-family: 'Montserrat', Impact, 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 128px;
        letter-spacing: 2px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <g class="logo-text">
    <!-- Contorno navy do projeto -->
    <text x="340" y="122" fill="none" stroke="#0B1354" stroke-width="22" stroke-linejoin="round">SANDY</text>
    <text x="340" y="252" fill="none" stroke="#0B1354" stroke-width="22" stroke-linejoin="round">SUMMER</text>

    <!-- Sombra -->
    <text x="343" y="126" fill="#0B1354" opacity="0.35">SANDY</text>
    <text x="343" y="256" fill="#0B1354" opacity="0.35">SUMMER</text>

    <!-- Preenchimento amarelo → laranja -->
    <text x="340" y="122" fill="url(#sandyFill)">SANDY</text>
    <text x="340" y="252" fill="url(#sandyFill)">SUMMER</text>
  </g>
</svg>
